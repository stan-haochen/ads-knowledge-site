<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" role="img" aria-labelledby="title desc">
<title id="title">Splay 的三种旋转</title>
<desc id="desc">左侧为旋转前，右侧为旋转后。绿色节点为 x，A、B、C、D 为保持内部结构的子树。依次为 Zig、Zig-Zig、Zig-Zag；节点与子树关系对应原图。</desc>
<style>.edge{fill:none;stroke:#8fa697;stroke-width:2.2}.node{fill:#edf3e7;stroke:#7b957c;stroke-width:1.6}.active{fill:#285d47;stroke:#285d47;stroke-width:1.6}.subtree{fill:#eaf1f3;stroke:#819ca3;stroke-width:1.5}.label{font:italic 23px Georgia,serif;text-anchor:middle;fill:#20332f}.active-label{fill:#fff}.subtree-label{font-size:20px}.case{font:600 20px system-ui,"Microsoft YaHei",sans-serif;fill:#285d47}.caption{font:14px system-ui,"Microsoft YaHei",sans-serif;fill:#68796d}.arrow{fill:none;stroke:#6b8f6d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
